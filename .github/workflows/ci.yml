name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      # Lockfile is required (generated by sync:oss). HUSKY=0 skips local git hooks in CI.
      - name: Install
        run: npm ci
        env:
          HUSKY: "0"
      - name: Build @velkin/ui
        run: npm run build:ui
      - name: Test
        run: npm test
